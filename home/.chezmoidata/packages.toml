# Homebrew packages installed by run_onchange_darwin-install-packages.sh.tmpl.
# Editing this file (or the script template) triggers a reinstall pass on the
# next `chezmoi apply`.

[packages.base]
brews = [
    "bat",
    "fzf",
    "git",
    "jq",
    "just",
    "lsd",
    "mise",
    "starship",
    "tmux",
    "zoxide",
    "zsh-completions",
    "zsh-syntax-highlighting",
]
casks = [
    "caffeine",
    "claude-code",
    "dropbox",
    "font-hack-nerd-font",
    "ghostty",
    "font-meslo-for-powerlevel10k",
    "iterm2",
    "spotify",
    "tailscale-app",
    "visual-studio-code",
]

# Only installed when the "work" flag is true (see .chezmoi.toml.tmpl).
[packages.work]
brews = [
    "gitleaks",
    "glab",
    "liquibase",
]
casks = [
    "docker-desktop",
    "postman",
]
