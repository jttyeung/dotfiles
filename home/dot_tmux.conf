### General ###
set -g mouse on
set -g escape-time 0
set -g history-limit 1000000
set -g detach-on-destroy off
setw -g mode-keys vi
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc,xterm-ghostty:Tc"

# Homebrew binaries (fzf, zoxide, lsd, git) must be visible to plugin popups
set-environment -g PATH "/opt/homebrew/bin:/usr/local/bin:/bin:/usr/bin"

# Copy to system clipboard
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

### Plugins ###
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'omerxx/tmux-floax'

### Other plugins ###
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'magenta'
set -g @floax-text-color 'blue'
set -g @floax-bind 'p'
set -g @floax-change-path 'true'
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

### sessionx ###
set -g @sessionx-bind 'o'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-fzf-builtin-tmux 'on'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-layout 'reverse'
set -g @sessionx-preview-location 'right'
set -g @sessionx-preview-ratio '55%'
set -g @sessionx-prompt ' '
set -g @sessionx-pointer '▶ '
set -g @sessionx-ls-command 'lsd --tree --color=always --icon=always'
set -g @sessionx-git-branch 'on'
set -g @sessionx-additional-options "--color pointer:9,spinner:92,marker:46"

### Theme (catppuccin) ###
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_number_position 'right'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W#{?window_zoomed_flag,(),}'
set -g @catppuccin_window_current_number_color '#{@thm_peach}'
set -g @catppuccin_date_time_text ' %H:%M'
set -g @catppuccin_directory_text ' #{b:pane_current_path}'

set -g status-position top
set -g status-justify absolute-centre
set -g status-left-length 100
set -g status-right-length 100
set -g status-left '#{E:@catppuccin_status_session}'
set -g status-right '#{E:@catppuccin_status_directory}#{E:@catppuccin_status_date_time}'

# Panes: thin divider, lavender when active
set -g pane-border-lines single
set -g pane-border-style 'fg=#{@thm_surface_1}'
set -g pane-active-border-style 'fg=#{@thm_lavender}'

# Window numbering from 1, splits open in the current directory
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Popup border/styling (tmux >= 3.3)
set -g popup-border-lines rounded

# Keep this at the very bottom
run '~/.tmux/plugins/tpm/tpm'
